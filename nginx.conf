# ===================================================================
# Nginx 反向代理配置 (SSL + HTTPS)
#
# 使用方法:
#   cp nginx.conf /etc/nginx/sites-available/xhub
#   ln -s /etc/nginx/sites-available/xhub /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ===================================================================

server {
    listen 80;
    server_name x.yourdomain.com;

    # 强制 HTTP → HTTPS 重定向
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name x.yourdomain.com;

    # ── SSL 证书 (Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/x.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── 前端静态资源 ──
    location / {
        proxy_pass http://127.0.0.1:8866;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接支持（视频流需要）
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # ── API 端点 ──
    location /api/ {
        proxy_pass http://127.0.0.1:8866/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 视频下载超时设置（大文件需要长时间连接）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── 日志 ──
    access_log /var/log/nginx/xhub_access.log;
    error_log  /var/log/nginx/xhub_error.log;
}
