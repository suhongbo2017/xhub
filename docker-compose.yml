services:
  xhub:
    build: .
    container_name: xhub
    ports:
      - "8866:8866"
    volumes:
      - ./xcookies.txt:/app/xcookies.txt
      - ./cookies:/app/cookies
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8866/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
