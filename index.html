<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X HUB | Premium Downloader</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050a10">
    <link rel="apple-touch-icon" href="https://abs.twimg.com/errors/logo46x38.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #0060ff;
            --bg: #050a10;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #e0e0e0;
            --accent: #ff00ff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        .header {
            padding: 2.5rem 1.5rem 1.5rem;
            text-align: center;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 1.5rem 6rem;
        }

        .search-container {
            position: relative;
            margin: 2rem 0;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        .btn-parse {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3);
        }

        .btn-parse:active {
            transform: scale(0.9);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }

        .shimmer {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .video-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
            backdrop-filter: blur(20px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .thumb-wrapper {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 1.5rem;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-break: anywhere;
        }

        .meta-info {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            opacity: 0.6;
            margin-bottom: 1.5rem;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 16px;
            color: #050a10;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .download-btn:active {
            transform: scale(0.98);
            filter: brightness(1.2);
        }

        .nav-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            background: rgba(10, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: flex;
            padding: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .tab-item {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab-item.active {
            background: var(--glass-border);
            color: var(--primary);
        }

        .tab-icon { font-size: 1.2rem; }
        .tab-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }

        .view { display: none; }
        .view.active { display: block; }

        .list-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .list-thumb {
            width: 80px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .list-content { flex: 1; min-width: 0; }
        .list-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }

        /* History item URL row */
        .history-url-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
        .history-url-text { flex: 1; min-width: 0; font-size: 0.72rem; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .copy-btn { flex-shrink: 0; padding: 2px 8px; font-size: 0.7rem; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; opacity: 0.8; transition: opacity 0.2s; }
        .copy-btn:hover { opacity: 1; }
        .copied { background: #4caf50 !important; }

        .empty-state { text-align: center; padding: 4rem 1rem; opacity: 0.4; }

        #error-msg {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="brand">X HUB</h1>
    </div>

    <div class="container">
        <!-- 解析视图 / Search & Parse View -->
        <div id="view-search" class="view active">
            <div id="error-msg"></div>
            <div class="search-container">
                <input type="text" id="url-input" placeholder="贴入 X 视频链接 / Paste X link..." autocomplete="off">
                <button class="btn-parse" id="parse-btn">⚡</button>
            </div>

            <div class="loading" id="search-loading">
                <div class="shimmer"></div>
                <p style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.5;">正在连接矩阵... / Parsing Matrix...</p>
            </div>

            <div id="result-container"></div>
        </div>

        <!-- 历史视图 / History View -->
        <div id="view-history" class="view">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;">
                <span style="color: var(--primary)">📜</span> 下载历史 / Download History
            </h2>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- 底部导航 / Bottom Navigation -->
    <div class="nav-bar">
        <div class="tab-item active" onclick="switchView('search')">
            <span class="tab-icon">🎯</span>
            <span class="tab-label">Parser</span>
        </div>
        <div class="tab-item" onclick="switchView('history')">
            <span class="tab-icon">📜</span>
            <span class="tab-label">History</span>
        </div>
    </div>

    <script>
        // 自动识别 API 基准地址 (支持 HTTP/HTTPS 与 任意域名)
        // Automatically detect API base URL (supports HTTP/HTTPS & any domain)
        const API_BASE = window.location.origin;
        
        // 下载历史存储 / Download History
        let downloadHistory = JSON.parse(localStorage.getItem('x_hub_history') || '[]');

        /**
         * 切换视图 (解析器/任务/历史) / Switch View
         */
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.tab-item');
            if (viewId === 'search') tabs[0].classList.add('active');
            if (viewId === 'history') tabs[1].classList.add('active');

            if (viewId === 'history') renderHistory();
        }

        /**
         * 解析视频：发送链接到后端探测元数据
         * Parse Video: Send URL to backend to extract metadata
         */
        async function parseVideo() {
            const url = document.getElementById('url-input').value;
            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');
            const loading = document.getElementById('search-loading');

            if (!url) return;

            errorMsg.style.display = 'none';
            resultContainer.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/api/parse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const result = await response.json();
                loading.style.display = 'none';

                if (result.success) {
                    const data = result.data;
                    renderResult(data);
                } else {
                    throw new Error(result.detail || 'Parsing failed');
                }
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.innerText = `Error: ${err.message}`;
                errorMsg.style.display = 'block';
            }
        }

/**
         * HTML 转义 / Escape HTML
         */
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /**
         * 渲染解析结果卡片 / Render result card
         */
        function renderResult(data) {
            const container = document.getElementById('result-container');
            window._currentVideoData = {
                url: data.url,
                title: data.title,
                thumb: data.thumbnail,
                is_m3u8: !!data.is_m3u8
            };
            container.innerHTML = `
                <div class="video-card">
                    <div class="thumb-wrapper">
                        <img src="${escapeHtml(data.thumbnail)}" onerror="this.src='https://abs.twimg.com/errors/logo46x38.png'">
                    </div>
                    <div class="video-info">
                        <div class="video-title">${escapeHtml(data.title)}</div>
                        <div class="meta-info">
                            <span>Quality: ${data.quality}</span>
                            <span>Duration: ${data.duration}s</span>
                        </div>
                        <button class="download-btn" id="download-btn">
                            <span>🚀</span> ${data.is_m3u8 ? '服务器合并下载 (HLS)' : '开始下载 (START DOWNLOAD)'}
                        </button>
                        <div style="font-size: 0.7rem; color: #888; margin-top: 10px; text-align: center;">
                            ${data.is_m3u8 ? '*该视频为流媒体，后端将自动合并为 MP4' : '*直连下载，由后端代理转发以确保成功'}
                        </div>
                    </div>
                </div>
            `;
            // Bind via addEventListener to avoid inline onclick escaping issues
            document.getElementById('download-btn').addEventListener('click', async () => {
                await doDownload(
                    window._currentVideoData.url,
                    window._currentVideoData.title,
                    window._currentVideoData.thumb,
                    window._currentVideoData.is_m3u8
                );
            }, { once: true });
        }

        /**
         * 实际执行下载：POST + blob + a.download
         */
        async function doDownload(url, title, thumb, is_m3u8 = false) {
            const safeTitle = String(title || 'video').replace(/[<>:"\/\\|?*]/g, '_');
            const btn = document.getElementById('download-btn');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<span>⏳</span> 正在下载...';
            btn.disabled = true;
            
            try {
                // POST to backend - use absolute URL to avoid any origin confusion
                const apiBase = window.location.origin;
                const apiUrl = apiBase + '/api/download';
                console.log('[Download] Target:', apiUrl);
                console.log('[Download] Payload:', JSON.stringify({
                    video_url: url,
                    title: safeTitle,
                    is_m3u8: !!is_m3u8
                }, null, 2));
                
                const resp = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_url: url,
                        title: safeTitle,
                        is_m3u8: !!is_m3u8
                    })
                });
                
                console.log('[Download] Response status:', resp.status);
                
                if (!resp.ok) {
                    let msg = 'HTTP ' + resp.status;
                    try { msg = (await resp.json()).detail || msg; } catch(e) {}
                    throw new Error(msg);
                }
                
                // Download the blob
                const blob = await resp.blob();
                console.log('[Download] Blob size:', blob.size, 'bytes');
                if (blob.size < 500) {
                    throw new Error('Response too small — not a valid video file');
                }
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = URL.createObjectURL(blob);
                a.download = safeTitle + '.mp4';
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    URL.revokeObjectURL(a.href);
                    a.remove();
                }, 5000);
                
                // Save to history
                downloadHistory.unshift({
                    id: Date.now(),
                    title: safeTitle,
                    thumb: thumb,
                    url: url,
                    date: new Date().toLocaleDateString()
                });
                localStorage.setItem('x_hub_history', JSON.stringify(downloadHistory.slice(0, 50)));
                showToast('已保存至历史记录 / Saved to history');
                
            } catch (err) {
                console.error('[Download] Fatal error:', err);
                alert('Download failed\n\n' + (err.message || String(err)));
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }

        /**
         * 渲染历史记录 / Render download history
         */
        function renderHistory() {
            const container = document.getElementById('history-list');
            if (downloadHistory.length === 0) {
                container.innerHTML = '<div class="empty-state">尚未下载过视频 / History is empty</div>';
                return;
            }

            container.innerHTML = downloadHistory.map((item, idx) => `
                <div class="list-item">
                    <img src="${item.thumb}" class="list-thumb">
                    <div class="list-content">
                        <div class="list-title">${item.title}</div>
                        <div style="font-size: 0.75rem; opacity: 0.5;">已于 ${item.date} 下载完成</div>
                        ${(item.url && item.url.length > 0) ? `
                        <div class="history-url-row">
                            <span class="history-url-text" title="${item.url}">${item.url}</span>
                            <button class="copy-btn" data-action="copy-history-url" data-idx="${idx}">📋 复制</button>
                        </div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 初始化事件绑定 / Initial bindings
        document.getElementById('parse-btn').addEventListener('click', parseVideo);
        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') parseVideo();
        });
        // 历史记录复制按钮（事件委托）/ History copy button (event delegation)
        document.getElementById('history-list').addEventListener('click', (e) => {
            const btn = e.target.closest('.copy-btn[data-action="copy-history-url"]');
            if (!btn) return;
            const idx = parseInt(btn.dataset.idx, 10);
            const item = downloadHistory[idx];
            if (item && item.url) {
                navigator.clipboard.writeText(item.url).then(() => {
                    btn.textContent = '✓';
                    btn.classList.add('copied');
                    setTimeout(() => { btn.textContent = '📋 复制'; btn.classList.remove('copied'); }, 1500);
                }).catch(() => {});
            }
        });
        // Toast notification
        function showToast(message) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText = 'position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:10px;font-size:0.85rem;z-index:9999;transition:opacity 0.3s;pointer-events:none;';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.style.opacity = '1';
            toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

    </script>
    <script>
        // Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('SW registered!', reg);
                }).catch(err => {
                    console.log('SW fail!', err);
                });
            });
        }
    </script>
</body>
</html>
