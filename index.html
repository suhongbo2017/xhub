/* X-HUB v1.0.0 — Retro Black-Gold UI */
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X HUB | Mosaic Downloader</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d2b">
    <style>
        /* ===== 复古黑黄配色变量 ===== */
        :root {
            --bg-dark: #1a1a1a;
            --bg-mid: #2b2b2b;
            --bg-light: #3d3d3d;
            --yellow-primary: #ffd700;
            --yellow-dark: #daa520;
            --yellow-light: #fff4b0;
            --yellow-accent: #ffaa00;
            --red-retro: #cc3333;
            --green-retro: #4caf50;
            --text-main: #f5f5dc;
            --text-dim: #999999;
            --border-thick: 4px solid var(--yellow-dark);
            --border-thin: 2px solid rgba(255,215,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Georgia, 'Times New Roman', serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 复古纸张纹理背景 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,215,0,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,215,0,0.02) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(255,215,0,0.03) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        /* 顶部装饰条纹 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                var(--yellow-primary),
                var(--yellow-primary) 20px,
                var(--bg-dark) 20px,
                var(--bg-dark) 40px
            );
            pointer-events: none;
            z-index: 9999;
        }

        .header {
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* 复古招牌 Logo */
        .brand {
            font-family: Georgia, serif;
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--yellow-primary);
            text-shadow: 2px 2px 0 var(--yellow-dark), 4px 4px 0 rgba(0,0,0,0.3);
            position: relative;
            display: inline-block;
            border: 3px double var(--yellow-dark);
            padding: 0.8rem 2rem;
            background: var(--bg-mid);
        }

        .brand::before {
            content: '★ X HUB ★';
            position: absolute;
            top: -1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--yellow-dark);
            letter-spacing: 6px;
            white-space: nowrap;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 0 1.5rem 8rem;
            position: relative;
            z-index: 1;
        }

        /* 搜索区域 - 复古输入框 */
        .search-container {
            position: relative;
            margin: 2rem 0;
            background: var(--bg-mid);
            border: var(--border-thick);
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 4px 4px 0 rgba(0,0,0,0.3);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 16px;
            color: var(--yellow-primary);
            font-family: Georgia, serif;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input::placeholder {
            color: var(--text-dim);
            font-style: italic;
        }

        .btn-parse {
            background: var(--yellow-primary);
            border: 2px solid var(--yellow-dark);
            width: 56px;
            height: 56px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 3px 3px 0 var(--yellow-dark);
            transition: all 0.1s;
            color: var(--bg-dark);
        }

        .btn-parse:hover {
            background: var(--yellow-light);
        }

        .btn-parse:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--yellow-dark);
        }

        /* 加载动画 - 复古齿轮旋转 */
        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }

        .shimmer {
            width: 48px;
            height: 48px;
            border: 4px dashed var(--yellow-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            position: relative;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            inset: 6px;
            border: 2px solid var(--yellow-dark);
            border-radius: 50%;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 视频卡片 - 复古海报风格 */
        .video-card {
            background: var(--bg-mid);
            border: var(--border-thick);
            overflow: hidden;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from { transform: translateY(-15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 复古边框装饰角标 */
        .video-card::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid var(--yellow-dark);
            pointer-events: none;
            z-index: 1;
        }

        .thumb-wrapper {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: var(--bg-dark);
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(0.3) contrast(1.1);
        }

        .video-info {
            padding: 1.2rem;
            position: relative;
        }

        .video-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
            line-break: anywhere;
            color: var(--yellow-primary);
            font-style: italic;
        }

        .meta-info {
            display: flex;
            gap: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            padding: 0.6rem 0;
            border-top: 1px dashed var(--yellow-dark);
            border-bottom: 1px dashed var(--yellow-dark);
        }

        .download-btn {
            background: var(--yellow-primary);
            border: 3px solid var(--yellow-dark);
            width: 100%;
            padding: 14px;
            color: var(--bg-dark);
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 3px 3px 0 var(--yellow-dark);
            transition: all 0.1s;
        }

        .download-btn:hover {
            background: var(--yellow-light);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--yellow-dark);
        }

        .download-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--yellow-dark);
        }

        /* 底部导航栏 - 复古按钮组 */
        .nav-bar {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 290px;
            background: var(--bg-mid);
            border: var(--border-thick);
            display: flex;
            padding: 6px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .tab-item {
            flex: 1;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
        }

        .tab-item:hover {
            background: rgba(255,215,0,0.1);
        }

        .tab-item.active {
            background: var(--yellow-primary);
            color: var(--bg-dark);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .tab-icon { font-size: 1.3rem; }
        .tab-label { 
            font-size: 0.65rem; 
            font-weight: bold; 
            letter-spacing: 1px;
        }

        /* 视图切换 */
        .view { display: none; }
        .view.active { display: block; }

        /* 列表项 - 复古票据风格 */
        .list-item {
            background: var(--bg-mid);
            border: 2px solid var(--yellow-dark);
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        }

        .list-item::after {
            content: '';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background: var(--yellow-primary);
            border-radius: 50%;
            opacity: 0.5;
        }

        .list-thumb {
            width: 80px;
            height: 45px;
            object-fit: cover;
            border: 2px solid var(--yellow-dark);
            filter: sepia(0.2);
        }

        .list-content { flex: 1; min-width: 0; }
        .list-title { 
            font-size: 0.9rem; 
            font-weight: bold; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            margin-bottom: 4px;
            color: var(--yellow-light);
        }
        .list-progress { 
            height: 8px; 
            background: var(--bg-dark); 
            border: 1px solid var(--yellow-dark);
            overflow: hidden; 
        }
        .progress-bar { 
            height: 100%; 
            background: repeating-linear-gradient(
                45deg,
                var(--yellow-primary),
                var(--yellow-primary) 4px,
                var(--yellow-dark) 4px,
                var(--yellow-dark) 8px
            );
        }

        /* 历史 URL 行 - 复古标签风格 */
        .history-url-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 8px;
            background: var(--bg-dark);
            border: 1px dashed var(--yellow-dark);
            font-family: Georgia, serif;
            font-size: 0.7rem;
            color: var(--yellow-primary);
            word-break: break-all;
        }

        .copy-btn {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            background: var(--yellow-primary);
            border: 2px solid var(--yellow-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            transition: all 0.1s;
            color: var(--bg-dark);
        }

        .copy-btn:hover {
            background: var(--yellow-light);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }

        .copy-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .copy-btn.copied {
            background: var(--green-retro);
            border-color: #2e7d32;
        }

        /* 空状态 & 错误提示 */
        .empty-state { 
            text-align: center; 
            padding: 5rem 1rem; 
            color: var(--text-dim);
            font-style: italic;
        }

        #error-msg {
            color: var(--red-retro);
            background: rgba(204, 51, 51, 0.08);
            padding: 12px;
            border: 2px solid var(--red-retro);
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
            text-align: center;
            font-weight: bold;
        }

        /* Toast 通知 - 复古标签风格 */
        .toast-pixel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: var(--yellow-primary);
            border: 3px solid var(--yellow-dark);
            color: var(--bg-dark);
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 10000;
            pointer-events: none;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
            animation: toastIn 0.2s ease-out;
        }

        .toast-pixel.success {
            background: var(--green-retro);
            border-color: #2e7d32;
        }

        .toast-pixel.error {
            background: var(--red-retro);
            border-color: #992222;
            color: white;
        }

        @keyframes toastIn {
            from { transform: translateX(-50%) translateY(-15px) scale(0.95); opacity: 0; }
            to { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="brand">X HUB</h1>
    </div>

    <div class="container">
        <!-- 解析视图 / Search & Parse View -->
        <div id="view-search" class="view active">
            <div id="error-msg"></div>
            <div class="search-container">
                <input type="text" id="url-input" placeholder="贴入 X 视频链接 / Paste X link..." autocomplete="off">
                <button class="btn-parse" id="parse-btn">⚡</button>
            </div>

            <div class="loading" id="search-loading">
                <div class="shimmer"></div>
                <p style="margin-top: 1rem; font-size: 0.85rem; opacity: 0.6;">正在连接矩阵... / Parsing Matrix...</p>
            </div>

            <div id="result-container"></div>
        </div>

        <!-- 任务视图 / Task List View -->
        <div id="view-tasks" class="view">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; color: var(--accent-cyan);">
                <span>⚡</span> 活跃任务 / Active Tasks
            </h2>
            <div id="task-list"></div>
        </div>

        <!-- 历史视图 / History View -->
        <div id="view-history" class="view">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; color: var(--accent-cyan);">
                <span>📜</span> 下载历史 / Download History
            </h2>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- 底部导航 / Bottom Navigation -->
    <div class="nav-bar">
        <div class="tab-item active" onclick="switchView('search')">
            <span class="tab-icon">🎯</span>
            <span class="tab-label">Parser</span>
        </div>
        <div class="tab-item" onclick="switchView('tasks')">
            <span class="tab-icon">⚡</span>
            <span class="tab-label">Tasks</span>
        </div>
        <div class="tab-item" onclick="switchView('history')">
            <span class="tab-icon">📜</span>
            <span class="tab-label">History</span>
        </div>
    </div>

    <script>
        // 自动识别 API 基准地址 (支持 HTTP/HTTPS 与 任意域名)
        const API_BASE = window.location.origin;
        
        // 应用状态存储 / App State
        let activeTasks = [];
        let downloadHistory = JSON.parse(localStorage.getItem('x_hub_history') || '[]');

        /**
         * 切换视图 (解析器/任务/历史) / Switch View
         */
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.tab-item');
            if (viewId === 'search') tabs[0].classList.add('active');
            if (viewId === 'tasks') tabs[1].classList.add('active');
            if (viewId === 'history') tabs[2].classList.add('active');

            if (viewId === 'history') renderHistory();
            if (viewId === 'tasks') renderTasks();
        }

        /**
         * 解析视频：发送链接到后端探测元数据
         * Parse Video: Send URL to backend to extract metadata
         */
        async function parseVideo() {
            const url = document.getElementById('url-input').value;
            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');
            const loading = document.getElementById('search-loading');

            if (!url) return;

            errorMsg.style.display = 'none';
            resultContainer.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/api/parse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const result = await response.json();
                loading.style.display = 'none';

                if (result.success) {
                    const data = result.data;
                    renderResult(data);
                } else {
                    throw new Error(result.detail || 'Parsing failed');
                }
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.innerText = `Error: ${err.message}`;
                errorMsg.style.display = 'block';
            }
        }

        /**
         * 渲染解析结果卡片 / Render result card
         */
        function renderResult(data) {
            window._currentVideoData = data;
            const container = document.getElementById('result-container');
            container.innerHTML = `
                <div class="video-card">
                    <div class="thumb-wrapper">
                        <img src="${data.thumbnail}" onerror="this.src='https://abs.twimg.com/errors/logo46x38.png'">
                    </div>
                    <div class="video-info">
                        <div class="video-title">${data.title}</div>
                        <div class="meta-info">
                            <span>Quality: ${data.quality}</span>
                            <span>Duration: ${data.duration}s</span>
                        </div>
                        <button class="download-btn" id="download-btn">
                            <span>🚀</span> ${data.is_m3u8 ? '服务器合并下载 (HLS)' : '开始下载 (START DOWNLOAD)'}
                        </button>
                        <div style="font-size: 0.65rem; color: var(--text-dim); margin-top: 10px; text-align: center;">
                            ${data.is_m3u8 ? '*该视频为流媒体，后端将自动合并为 MP4' : '*直连下载，由后端代理转发以确保成功'}
                        </div>
                    </div>
                </div>
            `;
            
            // 用 addEventListener 替代 inline onclick（避免 URL 编码问题）
            document.getElementById('download-btn').addEventListener('click', () => {
                // 防护：确保有可用的视频 URL
                if (!window._currentVideoData || !window._currentVideoData.url) {
                    showToast('⚠️ No video URL available — please re-parse the tweet.', 'error');
                    return;
                }
                startDownload(
                    window._currentVideoData.url,
                    encodeURIComponent(window._currentVideoData.title),
                    window._currentVideoData.thumbnail,
                    window._currentVideoData.is_m3u8
                );
            });
        }

        /**
         * 显示提示消息 / Show toast notification
         */
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast-pixel ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        /**
         * 开始下载：根据视频类型（MP4/HLS）通过后端转发或下载
         * Start Download: Forward or merge via backend depending on type
         */
        function startDownload(url, title, thumb, is_m3u8 = false) {
            const taskId = Date.now();
            const decodedTitle = decodeURIComponent(title);
            
            // 保存原始推文链接和历史页面（用于历史记录展示）
            window._currentVideoUrl = window._currentVideoData?.tweet_url || window._currentVideoData?.url || '';
            window._currentThumbUrl = thumb;
            
            // 添加到活跃任务列表 / Add to active tasks
            activeTasks.push({
                id: taskId,
                title: decodedTitle,
                thumb: thumb,
                progress: 0
            });

            // 自动跳转到任务视图 / Switch to tasks view
            switchView('tasks');

            // 构造下载请求 URL / Build download URL
            const tweet_url = window._currentVideoData?.tweet_url || url;
            const downloadUrl = `${API_BASE}/api/download?video_url=${encodeURIComponent(url)}&title=${title}&is_m3u8=${is_m3u8}&tweet_url=${encodeURIComponent(tweet_url)}`;
            
            // 使用隐形 A 标签触发浏览器原生下载弹窗
            // Use anchor to trigger native browser download
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = ""; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // 模拟进度条（由于浏览器流下载在前端难以精准捕捉，这里使用模拟反馈）
            // Progress bar simulation for UX
            let prog = 0;
            const taskObj = activeTasks.find(t => t.id === taskId);
            
            const interval = setInterval(() => {
                prog += Math.random() * 15;
                if (prog >= 100) {
                    prog = 100;
                    clearInterval(interval);
                    completeTask(taskId);
                }
                if (taskObj) taskObj.progress = prog;
                renderTasks();
            }, 600);
        }

        /**
         * 下载完成：从任务列表移动到历史记录 / Move task to history
         */
        function completeTask(id) {
            const taskIndex = activeTasks.findIndex(t => t.id === id);
            if (taskIndex > -1) {
                const task = activeTasks.splice(taskIndex, 1)[0];
                downloadHistory.unshift({
                    id: Date.now(),
                    title: task.title,
                    thumb: task.thumb,
                    date: new Date().toLocaleDateString(),
                    url: window._currentVideoUrl || ''  // 保存转换后的下载地址
                });
                // 持久化存储 / Save to localstorage
                localStorage.setItem('x_hub_history', JSON.stringify(downloadHistory.slice(0, 50)));
                renderTasks();
            }
        }

        /**
         * 从 data-url 属性复制原始 URL（避免浏览器对 onclick 参数二次编码）
         */
        async function copyFromDataUrl(btnElement) {
            const url = btnElement.getAttribute('data-url') || '';
            try {
                await navigator.clipboard.writeText(url);
                showToast('已复制到剪贴板 / Copied!', 'success');
            } catch (err) {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = url;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已复制到剪贴板 / Copied!', 'success');
            }
            btnElement.innerHTML = '✅';
            btnElement.classList.add('copied');
            setTimeout(() => {
                btnElement.innerHTML = '📋';
                btnElement.classList.remove('copied');
            }, 2000);
        }

        /**
         * 复制到剪贴板（通用版本，用于其他地方需要带编码参数的场景）
         */
        async function copyUrl(text, btnElement) {
            try {
                // 解码 URL（因为 HTML attribute 中的 encodeURIComponent）
                const decodedText = decodeURIComponent(text);
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(decodedText);
                    showToast('已复制到剪贴板 / Copied!', 'success');
                } else {
                    // Fallback for older browsers
                    const textarea = document.createElement('textarea');
                    textarea.value = decodedText;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('已复制到剪贴板 / Copied!', 'success');
                }
                
                // 更新按钮状态
                if (btnElement) {
                    btnElement.innerHTML = '✅';
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.innerHTML = '📋';
                        btnElement.classList.remove('copied');
                    }, 2000);
                }
            } catch (err) {
                showToast('复制失败 / Failed to copy', 'error');
                console.error('Copy failed:', err);
            }
        }

        /**
         * 渲染任务列表 / Render active task list
         */
        function renderTasks() {
            const container = document.getElementById('task-list');
            if (activeTasks.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无下载中的任务 / No active downloads</div>';
                return;
            }

            container.innerHTML = activeTasks.map(task => `
                <div class="list-item">
                    <img src="${task.thumb}" class="list-thumb">
                    <div class="list-content">
                        <div class="list-title">${task.title}</div>
                        <div class="list-progress">
                            <div class="progress-bar" style="width: ${task.progress}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        /**
         * 渲染历史记录 / Render download history
         */
        function renderHistory() {
            const container = document.getElementById('history-list');
            if (downloadHistory.length === 0) {
                container.innerHTML = '<div class="empty-state">尚未下载过视频 / History is empty</div>';
                return;
            }

            container.innerHTML = downloadHistory.map(item => {
                // 构建 URL 行（如果有）
                let urlRow = '';
                if (item.url && item.url !== '') {
                    urlRow = `
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                           style="text-decoration:none;color:var(--yellow-dark);font-size:0.7rem;overflow:hidden;text-overflow:ellipsis;display:block;white-space:nowrap;width:100%;cursor:pointer;">
                            🔗 ${item.url}
                        </a>
                        <div style="display:flex;gap:4px;margin-top:2px;justify-content:flex-end;padding-right:4px;">
                            <button class="copy-btn" data-url="${item.url}" onclick="event.preventDefault(); event.stopPropagation(); copyFromDataUrl(this)" title="复制链接">📋</button>
                            <button class="copy-btn" onclick="event.preventDefault(); event.stopPropagation(); openHistoryItem(${item.id})" title="打开推文">🔗</button>
                        </div>
                    `;
                }
                
                return `
                    <div class="list-item">
                        <img src="${item.thumb}" class="list-thumb">
                        <div class="list-content">
                            <div class="list-title">${item.title}</div>
                            <div style="font-size: 0.7rem; opacity: 0.5;">已于 ${item.date} 下载完成</div>
                            ${urlRow}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 初始化事件绑定 / Initial bindings
        document.getElementById('parse-btn').addEventListener('click', parseVideo);
        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') parseVideo();
        });

    </script>
    <script>
        // Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('SW registered!', reg);
                }).catch(err => {
                    console.log('SW fail!', err);
                });
            });
        }
    </script>
</body>
</html>
